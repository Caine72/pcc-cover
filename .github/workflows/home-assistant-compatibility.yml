name: Home Assistant compatibility

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-assistant-compatibility
  cancel-in-progress: true

jobs:
  resolve-releases:
    name: Resolve latest stable Home Assistant release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.releases.outputs.version }}
    steps:
      - name: Resolve latest stable release
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases_file="$(mktemp)"
          gh api "repos/home-assistant/core/releases?per_page=100" > "${releases_file}"
          python - "${releases_file}" <<'PY'
          import json
          import os
          import sys

          releases = json.load(open(sys.argv[1], encoding="utf-8"))
          stable = next(
              (
                  release
                  for release in releases
                  if not release["draft"] and not release["prerelease"]
              ),
              None,
          )
          if stable is None:
              raise SystemExit("No stable Home Assistant release found")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={stable['tag_name']}\n")
          PY

  validate-latest-core:
    name: Latest Core (${{ needs.resolve-releases.outputs.version }})
    needs: resolve-releases
    runs-on: ubuntu-latest
    steps:
      - name: Check out PCC Cover
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install latest stable Core test environment
        env:
          HA_VERSION: ${{ needs.resolve-releases.outputs.version }}
        run: |
          uv venv .venv --python "${pythonLocation}/bin/python"
          uv pip install --python .venv/bin/python \
            "homeassistant==${HA_VERSION}" \
            "pytest-homeassistant==${HA_VERSION}"
      - name: Run behavioral test suite
        run: .venv/bin/pytest -q
